# Opt-in only. Use with: docker compose -f docker-compose.yml -f docker-compose.secrets-core.yml ...
# Source paths must be external to this repository and are never created by Compose.
services:
  api:
    environment:
      SECRET_PROVIDER_MODE: file
      SECRET_PROVIDER_ROOT: /run/secrets/autoops
    volumes:
      - type: bind
        source: ${AUTOOPS_SECRET_JWT_ACCESS_FILE:?Set AUTOOPS_SECRET_JWT_ACCESS_FILE to an external jwt-access file}
        target: /run/secrets/autoops/jwt-access
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTOOPS_SECRET_JWT_REFRESH_FILE:?Set AUTOOPS_SECRET_JWT_REFRESH_FILE to an external jwt-refresh file}
        target: /run/secrets/autoops/jwt-refresh
        read_only: true
        bind:
          create_host_path: false

  worker:
    environment:
      SECRET_PROVIDER_MODE: file
      SECRET_PROVIDER_ROOT: /run/secrets/autoops
