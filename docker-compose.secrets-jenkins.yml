# Optional Jenkins token mount. Apply only with docker-compose.secrets-core.yml
# and separately approved Jenkins enablement. This overlay does not enable Jenkins.
services:
  api:
    volumes:
      - type: bind
        source: ${AUTOOPS_SECRET_JENKINS_API_TOKEN_FILE:?Set AUTOOPS_SECRET_JENKINS_API_TOKEN_FILE to an external jenkins-api-token file}
        target: /run/secrets/autoops/jenkins-api-token
        read_only: true
        bind:
          create_host_path: false

  worker:
    volumes:
      - type: bind
        source: ${AUTOOPS_SECRET_JENKINS_API_TOKEN_FILE:?Set AUTOOPS_SECRET_JENKINS_API_TOKEN_FILE to an external jenkins-api-token file}
        target: /run/secrets/autoops/jenkins-api-token
        read_only: true
        bind:
          create_host_path: false
