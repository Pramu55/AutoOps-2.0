# Optional GitHub Actions token mount. Apply only with docker-compose.secrets-core.yml
# when GITHUB_ACTIONS_ENABLED is already enabled by approved non-secret configuration.
services:
  api:
    volumes:
      - type: bind
        source: ${AUTOOPS_SECRET_GITHUB_ACTIONS_TOKEN_FILE:?Set AUTOOPS_SECRET_GITHUB_ACTIONS_TOKEN_FILE to an external github-actions-token file}
        target: /run/secrets/autoops/github-actions-token
        read_only: true
        bind:
          create_host_path: false
