# Transitional compatibility overlay for API/worker settings that remain
# environment-delivered. Apply only after docker-compose.secrets-core.yml.
services:
  api:
    env_file: !override
      - ${AUTOOPS_FILE_MODE_ENV_FILE:?Set AUTOOPS_FILE_MODE_ENV_FILE to an external runtime.env file}
      - ${AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE:?Set AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE to an external sensitive.env file}

  worker:
    env_file: !override
      - ${AUTOOPS_FILE_MODE_ENV_FILE:?Set AUTOOPS_FILE_MODE_ENV_FILE to an external runtime.env file}
      - ${AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE:?Set AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE to an external sensitive.env file}
