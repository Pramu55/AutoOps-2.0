# Transitional compatibility overlay for API/worker settings that remain
# environment-delivered. Apply only after docker-compose.secrets-core.yml.
services:
  api:
    env_file: !override
      - ${AUTOOPS_FILE_MODE_ENV_FILE:?Set AUTOOPS_FILE_MODE_ENV_FILE to an external runtime.env file}
      - ${AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE:?Set AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE to an external sensitive.env file}
    # Compose environment mappings override env_file values. Replace the base
    # map deliberately, omit only DATABASE_URL/REDIS_URL so sensitive.env is
    # authoritative for them, and retain every other current base mapping.
    environment: !override
      NODE_ENV: production
      API_PORT: '4000'
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      INFRA_TERRAFORM_ROOT: /app/infra/terraform
      INFRA_ANSIBLE_ROOT: /app/infra/ansible
      PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_SLUGS: ${PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_SLUGS:-autoops-demo,pramod-s-ss-workspace}
      PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_IDS: ${PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_IDS:-}
      SECRET_PROVIDER_MODE: file
      SECRET_PROVIDER_ROOT: /run/secrets/autoops

  worker:
    env_file: !override
      - ${AUTOOPS_FILE_MODE_ENV_FILE:?Set AUTOOPS_FILE_MODE_ENV_FILE to an external runtime.env file}
      - ${AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE:?Set AUTOOPS_FILE_MODE_SENSITIVE_ENV_FILE to an external sensitive.env file}
    # Match the API compatibility boundary while retaining worker defaults.
    environment: !override
      NODE_ENV: production
      WORKER_PORT: '4001'
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      INFRA_TERRAFORM_ROOT: /app/infra/terraform
      INFRA_ANSIBLE_ROOT: /app/infra/ansible
      PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_SLUGS: ${PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_SLUGS:-autoops-demo,pramod-s-ss-workspace}
      PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_IDS: ${PROVIDER_INVENTORY_ALLOWED_ORGANIZATION_IDS:-}
      SECRET_PROVIDER_MODE: file
      SECRET_PROVIDER_ROOT: /run/secrets/autoops
